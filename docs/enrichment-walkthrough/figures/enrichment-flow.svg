<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Calibri, Arial, sans-serif" role="img" aria-label="Enrichment flow: an SAP record is cleaned, identified against registries, and its department found. If anything is still unknown, the web is read and the answer re-checked against a registry. Every record is then verified and judged, and written back to SAP either trusted or flagged for a data steward. Address validation, issues and deduplication follow outside the API.">
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3D4A58"/></marker>
  </defs>

  <!-- Title -->
  <text x="40" y="74" font-size="40" font-weight="700" fill="#15202B">How one SAP record gets enriched</text>
  <text x="40" y="110" font-size="20" fill="#5B6776">Registries first. The web and a language model only step in where a registry can't answer, and never get the last word.</text>

  <!-- Legend -->
  <circle cx="48" cy="160" r="7" fill="#0F766E"/><text x="62" y="166" font-size="16" fill="#15202B">Registry</text>
  <circle cx="160" cy="160" r="7" fill="#D9A900"/><text x="174" y="166" font-size="16" fill="#15202B">Web</text>
  <circle cx="240" cy="160" r="7" fill="#BE185D"/><text x="254" y="166" font-size="16" fill="#15202B">Language model</text>
  <circle cx="400" cy="160" r="7" fill="#3D4A58"/><text x="414" y="166" font-size="16" fill="#15202B">Fixed rule</text>
  <text x="520" y="166" font-size="15" fill="#5B6776">· dots show which sources a step uses</text>

  <!-- Start: SAP record -->
  <rect x="40" y="245" width="120" height="100" rx="50" fill="#15202B"/>
  <text x="100" y="289" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">SAP</text>
  <text x="100" y="312" font-size="15" fill="#FFFFFF" text-anchor="middle">record</text>

  <!-- Process boxes -->
  <g fill="#F7F9FA" stroke="#3D4A58" stroke-width="1.8">
    <rect x="196" y="230" width="170" height="130" rx="10"/>
    <rect x="402" y="230" width="180" height="130" rx="10" fill="#E1F1EE" stroke="#0F766E"/>
    <rect x="618" y="230" width="170" height="130" rx="10"/>
    <rect x="990" y="230" width="170" height="130" rx="10"/>
    <rect x="1196" y="230" width="170" height="130" rx="10"/>
    <rect x="804" y="472" width="170" height="130" rx="10" fill="#FBF3C4" stroke="#D9A900"/>
  </g>
  <!-- Decision -->
  <polygon points="889,228 956,295 889,362 822,295" fill="#FFFFFF" stroke="#3D4A58" stroke-width="1.8"/>
  <text x="889" y="290" font-size="15" font-weight="700" fill="#15202B" text-anchor="middle">Anything still</text>
  <text x="889" y="309" font-size="15" font-weight="700" fill="#15202B" text-anchor="middle">unknown?</text>

  <!-- Box text -->
  <g font-size="19" font-weight="700" fill="#15202B">
    <text x="212" y="264">1 Clean</text>
    <text x="418" y="264">2 Identify</text>
    <text x="634" y="264">3 Department</text>
    <text x="1006" y="264">5 Verify</text>
    <text x="1212" y="264">6 Judge</text>
    <text x="820" y="506">4 Last resort</text>
  </g>
  <g font-size="15" fill="#15202B">
    <text x="212" y="292">Put every value in</text><text x="212" y="313">the right field</text>
    <text x="418" y="292">Ask the registries</text><text x="418" y="313">ROR · GLEIF · Wikidata</text>
    <text x="634" y="292">Find the unit:</text><text x="634" y="313">registry, then web</text>
    <text x="1006" y="292">Retry, tie the</text><text x="1006" y="313">website, tidy address</text>
    <text x="1212" y="292">Trust level per</text><text x="1212" y="313">value, flag if needed</text>
    <text x="820" y="534">Search, read 3 pages,</text><text x="820" y="555">re-check the registry</text>
  </g>
  <!-- Source dots -->
  <circle cx="220" cy="340" r="6" fill="#3D4A58"/><circle cx="236" cy="340" r="6" fill="#BE185D"/>
  <circle cx="426" cy="340" r="6" fill="#0F766E"/><circle cx="442" cy="340" r="6" fill="#BE185D"/>
  <circle cx="642" cy="340" r="6" fill="#0F766E"/><circle cx="658" cy="340" r="6" fill="#D9A900"/><circle cx="674" cy="340" r="6" fill="#BE185D"/>
  <circle cx="1014" cy="340" r="6" fill="#0F766E"/><circle cx="1030" cy="340" r="6" fill="#D9A900"/><circle cx="1046" cy="340" r="6" fill="#BE185D"/><circle cx="1062" cy="340" r="6" fill="#3D4A58"/>
  <circle cx="1220" cy="340" r="6" fill="#3D4A58"/>
  <circle cx="828" cy="582" r="6" fill="#D9A900"/><circle cx="844" cy="582" r="6" fill="#BE185D"/><circle cx="860" cy="582" r="6" fill="#0F766E"/>

  <!-- Notes under boxes -->
  <g font-size="13" fill="#5B6776" text-anchor="middle">
    <text x="492" y="384">a match gives the official</text><text x="492" y="401">name and a registry id</text>
    <text x="1281" y="384">verified · provisional · low</text>
    <text x="889" y="622">a model's answer must come from</text><text x="889" y="639">the pages, then pass a registry</text>
  </g>

  <!-- Arrows -->
  <g stroke="#3D4A58" stroke-width="2.2" fill="none">
    <line x1="160" y1="295" x2="192" y2="295" marker-end="url(#ar)"/>
    <line x1="366" y1="295" x2="398" y2="295" marker-end="url(#ar)"/>
    <line x1="582" y1="295" x2="614" y2="295" marker-end="url(#ar)"/>
    <line x1="788" y1="295" x2="818" y2="295" marker-end="url(#ar)"/>
    <line x1="956" y1="295" x2="986" y2="295" marker-end="url(#ar)"/>
    <line x1="1160" y1="295" x2="1192" y2="295" marker-end="url(#ar)"/>
    <line x1="889" y1="362" x2="889" y2="468" marker-end="url(#ar)"/>
    <path d="M974 537H1075V364" marker-end="url(#ar)"/>
    <path d="M1366 295H1388V240H1406" marker-end="url(#ar)"/>
    <path d="M1388 295V350H1406" marker-end="url(#ar)"/>
  </g>
  <text x="971" y="285" font-size="15" font-weight="700" fill="#3D4A58" text-anchor="middle">no</text>
  <text x="899" y="430" font-size="15" font-weight="700" fill="#3D4A58">yes</text>

  <!-- Ends -->
  <rect x="1410" y="200" width="160" height="80" rx="10" fill="#E1F1EE" stroke="#0F766E" stroke-width="1.8"/>
  <text x="1424" y="233" font-size="17" font-weight="700" fill="#15202B">Back to SAP</text>
  <text x="1424" y="258" font-size="14" fill="#15202B">trusted, no review</text>
  <rect x="1410" y="310" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#3D4A58" stroke-width="1.8"/>
  <text x="1424" y="343" font-size="17" font-weight="700" fill="#15202B">Back to SAP</text>
  <text x="1424" y="368" font-size="14" fill="#15202B">flagged for a steward</text>

  <!-- Three rules -->
  <text x="40" y="698" font-size="18" font-weight="700" fill="#15202B">The three rules behind every step</text>
  <rect x="40" y="714" width="490" height="62" rx="8" fill="#E1F1EE" stroke="#0F766E" stroke-width="1.5"/>
  <text x="58" y="741" font-size="16" font-weight="700" fill="#15202B">Registries come first</text>
  <text x="58" y="762" font-size="14" fill="#15202B">a verified match writes the official name</text>
  <rect x="550" y="714" width="500" height="62" rx="8" fill="#FAE6EF" stroke="#BE185D" stroke-width="1.5"/>
  <text x="568" y="741" font-size="16" font-weight="700" fill="#15202B">Web and model answers are checked</text>
  <text x="568" y="762" font-size="14" fill="#15202B">they must pass a registry, or they ship flagged</text>
  <rect x="1070" y="714" width="500" height="62" rx="8" fill="#E7EBF0" stroke="#3D4A58" stroke-width="1.5"/>
  <text x="1088" y="741" font-size="16" font-weight="700" fill="#15202B">Nothing is invented</text>
  <text x="1088" y="762" font-size="14" fill="#15202B">if unsure, SAP's own value is kept and flagged</text>

  <!-- After the API -->
  <text x="40" y="836" font-size="16" font-weight="700" fill="#15202B">After enrichment, outside this API:</text>
  <g fill="#FFFFFF" stroke="#3D4A58" stroke-width="1.5" stroke-dasharray="6 5">
    <rect x="320" y="808" width="270" height="44" rx="8"/>
    <rect x="630" y="808" width="140" height="44" rx="8"/>
    <rect x="810" y="808" width="180" height="44" rx="8"/>
  </g>
  <g font-size="15" fill="#15202B" text-anchor="middle">
    <text x="455" y="836">Address validation · HERE API</text>
    <text x="700" y="836">Issues</text>
    <text x="900" y="836">Deduplication</text>
  </g>
  <g stroke="#3D4A58" stroke-width="2" fill="none">
    <line x1="590" y1="830" x2="626" y2="830" marker-end="url(#ar)"/>
    <line x1="770" y1="830" x2="806" y2="830" marker-end="url(#ar)"/>
  </g>
</svg>
